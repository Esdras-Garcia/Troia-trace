services:
  - type: web
    name: troia-trace-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: troia-trace-db
          property: connectionString
      - key: JPA_DDL_AUTO
        value: validate
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.onrender.com,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:19006,http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:8084,http://127.0.0.1:19006

  - type: web
    name: troia-trace-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://troia-trace-backend.onrender.com

databases:
  - name: troia-trace-db
    plan: free
    databaseName: troia_trace
    user: troia_trace
